name: Share data between jobs

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      outid: ${{steps.step1-id.outputs.MY_VAR}}
    steps:
      - name: Step 1 - set variable
        id: step1-id
        run: echo "MY_VAR=Hello Rajiv" >> $GITHUB_OUTPUT

      - name: Step 2 - use variable
        run: echo "Value is $MY_VAR"

  result:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Result-step
        run: echo "${{needs.build.outputs.outid}} How are you?"
        

           
          
