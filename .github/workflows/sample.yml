name: if-condition

on:
  workflow_dispatch:
    inputs:
      select-env:
        description: 'ENV selection'
        required: true
        default: 'Please-Select-ENV'
        type: choice
        options:
          - Please-Select-ENV
          - dev
          - UAT

jobs:
  dev-build:
    if: ${{ github.event.inputs.select-env == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: step1 - dev
        run: echo "Done in dev"

  UAT-build:
    if: ${{ github.event.inputs.select-env == 'UAT' }}
    runs-on: ubuntu-latest
    steps:
      - name: step1 - UAT
        run: echo "Done in UAT"

