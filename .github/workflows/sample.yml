name: cicd pipeline

on:
  workflow_dispatch:
    inputs:
      Environments:
        description: "Choose Environments"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - Uat
          - Prod

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev
        if: ${{ github.event.inputs.Environments == 'dev' }}
        run: echo "Hi Rajiv please deploy this changes on dev"

      - name: Deploy to UAT
        if: ${{ github.event.inputs.Environments == 'Uat' }}
        run: echo "Hi Rajiv please deploy this changes on uat"

      - name: Deploy to Prod
        if: ${{ github.event.inputs.Environments == 'Prod' }}
        run: echo "Hi Rajiv please deploy this changes on prod"
