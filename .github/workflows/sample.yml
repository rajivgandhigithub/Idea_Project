on:
  workflow_dispatch:
    inputs:
      runTests:
        description: 'Run tests before build?'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Conditional step
        if: ${{ github.event.inputs.runTests == 'true' }}
        run: echo "Running tests..."
