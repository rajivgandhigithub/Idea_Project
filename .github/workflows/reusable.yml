name: Reusable Greeting

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      fathername:
        required: true
        type: string

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello, ${{ inputs.username }}!"
        
      - name: Print Hello father
        run: echo "Hello, ${{ inputs.fathername }}!"
